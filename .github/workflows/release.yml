name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create GitHub releases

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish (mac, unsigned)
        if: matrix.platform == 'mac' && secrets.CSC_LINK == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:mac -w apps/electron -- --publish always

      - name: Build and publish (mac, signed)
        if: matrix.platform == 'mac' && secrets.CSC_LINK != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID:             ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:        ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK:             ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:     ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run build:mac -w apps/electron -- --publish always

      - name: Build and publish (${{ matrix.platform }})
        if: matrix.platform != 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:${{ matrix.platform }} -w apps/electron -- --publish always
