<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #1c1c1e;
      color: #e5e5ea;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #2c2c2e;
    }

    #header-title {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #48484a;
      transition: background 0.3s;
    }
    #status-dot.online  { background: #30d158; }
    #status-dot.offline { background: #ff453a; }

    #body {
      padding: 16px 14px;
    }

    .state {
      display: none;
    }
    .state.active {
      display: block;
    }

    /* ── Loading ── */
    #state-loading {
      color: #636366;
      font-size: 12px;
      text-align: center;
      padding: 8px 0;
    }

    /* ── Offline ── */
    #state-offline h2 {
      font-size: 13px;
      font-weight: 600;
      color: #aeaeb2;
      margin-bottom: 6px;
    }
    #state-offline p {
      font-size: 12px;
      color: #636366;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    /* ── Online ── */
    #state-online .provider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }
    #state-online .provider-label {
      font-size: 12px;
      color: #aeaeb2;
      width: 52px;
    }
    #state-online .cookie-status {
      font-size: 12px;
    }
    .cookie-status.found   { color: #30d158; }
    .cookie-status.missing { color: #636366; }

    .hint {
      font-size: 11px;
      color: #636366;
      margin-top: 10px;
      line-height: 1.5;
    }

    /* ── Shared ── */
    button {
      width: 100%;
      padding: 9px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
      margin-top: 14px;
    }
    button:hover   { opacity: 0.85; }
    button:active  { opacity: 0.7; }
    button:disabled { opacity: 0.4; cursor: default; }

    #btn-launch { background: #2c2c2e; color: #aeaeb2; }
    #btn-sync   { background: #0a84ff; color: #fff; }

    #feedback {
      font-size: 11px;
      text-align: center;
      min-height: 16px;
      margin-top: 10px;
      color: #30d158;
    }
    #feedback.error { color: #ff453a; }

    #footer {
      padding: 8px 14px 12px;
      border-top: 1px solid #2c2c2e;
      font-size: 10px;
      color: #48484a;
      text-align: right;
    }
  </style>
</head>
<body>

<div id="header">
  <span id="header-title">Runway</span>
  <div id="status-dot"></div>
</div>

<div id="body">

  <div id="state-loading" class="state active">
    Checking desktop app…
  </div>

  <div id="state-offline" class="state">
    <h2>Desktop app not running</h2>
    <p>Runway Desktop needs to be open to receive session data and track your quota.</p>
    <button id="btn-launch">Launch Runway Desktop</button>
  </div>

  <div id="state-online" class="state">
    <div class="provider-row">
      <span class="provider-label">Claude</span>
      <span id="claude-cookie-status" class="cookie-status missing">session not found</span>
    </div>
    <div class="hint" id="online-hint"></div>
    <button id="btn-sync" disabled>Sync Session</button>
    <div id="feedback"></div>
  </div>

</div>

<div id="footer">
  runway v0.1.0
</div>

<script src="popup.js"></script>
</body>
</html>
