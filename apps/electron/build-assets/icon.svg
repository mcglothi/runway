<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mark-grad" x1="256" y1="256" x2="768" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00C2FF"/>
      <stop offset="1" stop-color="#6E40C9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg-grad)" />
  
  <!-- Subtle inner glow overlay -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#mark-grad)" fill-opacity="0.05" />

  <!-- Main Path Mark -->
  <g filter="url(#glow)">
    <path d="M256 832L512 256L768 832" stroke="url(#mark-grad)" stroke-width="120" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M384 576H640" stroke="url(#mark-grad)" stroke-width="120" stroke-linecap="round"/>
  </g>
</svg>
