<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111113;
      color: #e5e5ea;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      font-size: 13px;
      user-select: none;
      overflow: hidden;
      border-radius: 12px;
    }

    #header {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 9px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(180deg, #1a1a1d 0%, #111113 100%);
    }

    #header-left {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      letter-spacing: -0.2px;
    }

    .runway-mark {
      width: 22px;
      height: 22px;
      background: #0F172A;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .runway-mark::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,194,255,0.15) 0%, rgba(110,64,201,0.15) 100%);
    }
    .runway-mark-inner {
      width: 12px;
      height: 12px;
      position: relative;
      z-index: 1;
    }

    #header-right {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 2px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #48484a;
      cursor: pointer;
      font-size: 14px;
      padding: 3px 6px;
      border-radius: 5px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }
    .icon-btn:hover { color: #e5e5ea; background: rgba(255,255,255,0.08); }
    .icon-btn.active { color: #0a84ff; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .icon-btn.spinning { animation: spin 0.7s linear infinite; color: #636366; }

    #gauges {
      padding: 4px 0 2px;
    }

    #gauges.horizontal {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      padding: 10px 14px;
      gap: 12px;
    }

    #gauges.horizontal .provider-sep {
      display: none;
    }

    #gauges.horizontal .row {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 8px;
      gap: 6px;
      width: 105px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px;
    }

    #gauges.horizontal .provider-icon {
      margin-bottom: 2px;
    }

    #gauges.horizontal .agent-label {
      align-items: center;
      text-align: center;
    }

    #gauges.horizontal .bar-track {
      width: 100%;
      height: 4px;
    }

    #gauges.horizontal .pct {
      text-align: center;
      width: 100%;
    }

    #gauges.horizontal .runway-col {
      text-align: center;
      width: 100%;
      font-size: 10px;
    }

    .provider-sep {
      height: 1px;
      background: rgba(255,255,255,0.05);
      margin: 2px 14px;
    }

    /* icon | label | bar | pct | runway */
    .row {
      display: grid;
      grid-template-columns: 22px 62px 1fr 44px 56px;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      transition: background 0.12s;
    }
    .row:hover { background: rgba(255,255,255,0.04); border-radius: 6px; }

    .provider-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .agent-label {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .agent-name {
      font-size: 12px;
      font-weight: 600;
      color: #e5e5ea;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .win-tag {
      font-size: 10px;
      font-weight: 400;
      color: #48484a;
      letter-spacing: 0.2px;
    }

    .bar-track {
      height: 5px;
      background: rgba(255,255,255,0.07);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bar-fill.low  { background: linear-gradient(to right, #28b84e, #30d158); }
    .bar-fill.mid  { background: linear-gradient(to right, #e5a800, #ffd60a); }
    .bar-fill.high { background: linear-gradient(to right, #e0352b, #ff453a); }
    .bar-fill.none { background: rgba(255,255,255,0.05); width: 100% !important; }

    .pct {
      font-size: 12px;
      font-weight: 600;
      text-align: right;
      color: #e5e5ea;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pct.dim   { color: #2c2c2e; }
    .pct.error { color: #ff9f0a; font-weight: 400; }

    .runway-col {
      font-size: 11px;
      color: #3a3a3c;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: normal;
      overflow: hidden;
      line-height: 1.4;
    }
    .runway-col.ok     { color: #30d158; }
    .runway-col.warn   { color: #ffd60a; }
    .runway-col.crit   { color: #ff453a; }
    .runway-col.signin { color: #3a3a3c; }

    .cost-est {
      font-size: 10px;
      color: #3a3a3c;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .cost-est.has-cost { color: #48484a; }

    .runway-link {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: #3a3a3c;
      cursor: pointer;
    }
    .runway-link:hover { color: #0a84ff; text-decoration-color: #0a84ff; }

    #footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px 9px;
      border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 1px;
    }

    #last-updated {
      font-size: 10px;
      color: #3a3a3c;
    }

    #update-banner {
      display: none;
      margin: 4px 14px 0;
      padding: 7px 10px;
      background: rgba(48, 209, 88, 0.08);
      border: 1px solid rgba(48, 209, 88, 0.2);
      border-radius: 8px;
      font-size: 11px;
      color: #30d158;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #update-banner a {
      color: #30d158;
      text-decoration: underline;
      text-decoration-color: rgba(48, 209, 88, 0.4);
      cursor: pointer;
      white-space: nowrap;
    }
    #update-banner a:hover { text-decoration-color: #30d158; }

    #not-configured {
      padding: 24px 14px;
      color: #48484a;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }
    #not-configured a {
      color: #0a84ff;
      cursor: pointer;
      text-decoration: none;
    }
    #not-configured a:hover { text-decoration: underline; }

    /* Onboarding / connect hints */
    #connect-hint {
      margin: 4px 14px 6px;
      padding: 9px 12px;
      background: rgba(10, 132, 255, 0.07);
      border: 1px solid rgba(10, 132, 255, 0.18);
      border-radius: 8px;
      font-size: 11px;
      color: #636366;
      line-height: 1.5;
    }
    #connect-hint strong { color: #aeaeb2; font-weight: 600; }
    #connect-hint a { color: #0a84ff; cursor: pointer; text-decoration: none; }
    #connect-hint a:hover { text-decoration: underline; }

    /* Skeleton loading shimmer */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skel {
      border-radius: 3px;
      height: 5px;
      background: linear-gradient(to right, #2c2c2e 8%, #3a3a3c 18%, #2c2c2e 33%);
      background-size: 800px 100%;
      animation: shimmer 1.4s linear infinite;
    }
    .skel-text {
      height: 10px;
      border-radius: 3px;
      background: linear-gradient(to right, #2c2c2e 8%, #3a3a3c 18%, #2c2c2e 33%);
      background-size: 800px 100%;
      animation: shimmer 1.4s linear infinite;
    }
  </style>
</head>
<body>

<div id="header">
  <div id="header-left">
    <div class="runway-mark">
      <svg class="runway-mark-inner" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 10L6 3L9 10" stroke="url(#mark-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.5 7h3" stroke="url(#mark-grad)" stroke-width="1.8" stroke-linecap="round"/>
        <defs>
          <linearGradient id="mark-grad" x1="0" y1="0" x2="12" y2="12" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00C2FF"/>
            <stop offset="1" stop-color="#6E40C9"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <span>Runway</span>
  </div>
  <div id="header-right">
    <button class="icon-btn" id="btn-pin" title="Pin to top">📌</button>
    <button class="icon-btn" id="btn-refresh" title="Refresh now">↻</button>
    <button class="icon-btn" id="btn-settings" title="Settings">⚙</button>
  </div>
</div>

<div id="gauges">
  <!-- rows injected by JS -->
</div>

<div id="connect-hint" style="display:none"></div>

<div id="update-banner">
  <span id="update-text"></span>
  <a id="update-link">Download</a>
</div>

<div id="footer">
  <span id="last-updated">—</span>
</div>

<script>
  const PROVIDER_ORDER = ['claude', 'codex', 'gemini', 'copilot'];

  // Provider display metadata with inline SVG icons
  const PROVIDERS = {
    claude: {
      name: 'Claude',
      // Anthropic A-mark in brand orange
      icon: `<svg viewBox="0 0 16 16" fill="none" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 1.5L2.2 14.5H4.9L6 11.6H10L11.1 14.5H13.8L8 1.5ZM6.8 9.5L8 5.8L9.2 9.5H6.8Z" fill="#CF6A33"/>
      </svg>`,
    },
    codex: {
      name: 'Codex',
      // OpenAI-style: concentric circles (simplified logo feel)
      icon: `<svg viewBox="0 0 16 16" fill="none" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="8" r="6.5" stroke="#10A37F" stroke-width="1.3"/>
        <circle cx="8" cy="8" r="3.2" fill="#10A37F"/>
      </svg>`,
    },
    gemini: {
      name: 'Gemini',
      // 4-pointed star / sparkle — matches the Gemini logo shape (now in brand blue)
      icon: `<svg viewBox="0 0 16 16" fill="none" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 1C8 1 8.65 5.8 11.2 8C8.65 10.2 8 15 8 15C8 15 7.35 10.2 4.8 8C7.35 5.8 8 1 8 1Z" fill="#8EBBFF"/>
        <path d="M1 8C1 8 5.8 8.65 8 11.2C10.2 8.65 15 8 15 8C15 8 10.2 7.35 8 4.8C5.8 7.35 1 8 1 8Z" fill="#4285F4"/>
      </svg>`,
    },
    copilot: {
      name: 'Copilot',
      // GitHub Copilot — circle with two "eye" highlights
      icon: `<svg viewBox="0 0 16 16" fill="none" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="8" r="6.8" fill="#8957E5"/>
        <circle cx="5.7" cy="7.4" r="1.5" fill="white"/>
        <circle cx="10.3" cy="7.4" r="1.5" fill="white"/>
        <path d="M5.4 10.6Q8 12.2 10.6 10.6" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
      </svg>`,
    },
  };

  // ── Format helpers ────────────────────────────────────────────────────────────
  function fmtRunway(ms) {
    if (ms == null || isNaN(ms)) return null;
    if (ms <= 0) return '0m';
    const totalMin = Math.floor(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    if (h >= 48) {
      const d = Math.floor(h / 24);
      const rh = h % 24;
      return `${d}d${String(rh).padStart(2, '0')}h`;
    }
    return h > 0 ? `${h}h${String(m).padStart(2, '0')}m` : `${m}m`;
  }

  function runwayClass(ms) {
    if (ms == null) return '';
    if (ms < 30 * 60000) return 'crit';
    if (ms < 90 * 60000) return 'warn';
    return 'ok';
  }

  function barClass(pct, invert = false) {
    if (pct == null) return 'none';
    if (invert) {
      // Higher is better (e.g. acceptance rate) — just use a neutral fill
      return 'low';
    }
    if (pct >= 80) return 'high';
    if (pct >= 50) return 'mid';
    return 'low';
  }

  // ── Render ────────────────────────────────────────────────────────────────────
  async function updateOrientation() {
    const config = await window.runway.getConfig();
    const gauges = document.getElementById('gauges');
    if (config.orientation === 'horizontal') {
      gauges.classList.add('horizontal');
    } else {
      gauges.classList.remove('horizontal');
    }
    
    const pinBtn = document.getElementById('btn-pin');
    if (config.pinned !== false) {
      pinBtn.classList.add('active');
      pinBtn.textContent = '📌';
    } else {
      pinBtn.classList.remove('active');
      pinBtn.textContent = '📍';
    }
  }

  function render(snapshots) {
    const gauges = document.getElementById('gauges');
    updateOrientation();

    if (Object.keys(snapshots).length === 0) {
      gauges.innerHTML = `<div id="not-configured">
        No providers configured yet.<br>
        <a id="open-settings-link">Open Settings</a> to connect your accounts.
      </div>`;
      document.getElementById('open-settings-link')
        ?.addEventListener('click', () => window.runway.openSettings());
      return;
    }

    const activeAgents = PROVIDER_ORDER.filter(a => snapshots[a]);
    const html = activeAgents.map((agent, idx) => {
      const snap = snapshots[agent];
      const sep = idx > 0 ? '<div class="provider-sep"></div>' : '';

      // Special case: Copilot — seat utilization row + optional acceptance rate sub-row
      if (agent === 'copilot') {
        const mainRow = renderWindowRow(agent, snap.short?.total_seats ? 'seats' : null, snap.short, false);
        const subRow  = snap.long?.text
          ? renderWindowRow(agent, 'accept', snap.long, true, false, true)
          : '';
        return sep + mainRow + subRow;
      }

      // Special case: Gemini should always be a single Daily row
      if (agent === 'gemini') {
        const geminiWin = { ...(snap.short || snap.long || {}) };
        if (snap.long?.text) geminiWin.text = snap.long.text;
        return sep + renderWindowRow(agent, 'Daily', geminiWin, false);
      }

      if (snap.short && snap.long) {
        return sep
          + renderWindowRow(agent, '5 hr',  snap.short, false)
          + renderWindowRow(agent, '7 day', snap.long,  true);
      }
      const tag = snap.short ? 'Daily' : null;
      return sep + renderWindowRow(agent, tag, snap.short ?? snap.long, false);
    }).join('');

    gauges.innerHTML = html;
  }

  function renderWindowRow(agent, windowTag, window, isSub, signInHint = false, invertBar = false) {
    const prov = PROVIDERS[agent] ?? { name: agent.charAt(0).toUpperCase() + agent.slice(1), icon: '' };
    const fillClass = barClass(window?.utilization, invertBar);
    const barW = window?.utilization != null ? Math.min(100, Math.round(window.utilization)) : 0;
    const pct = window?.utilization;
    let pctDisplay = pct != null ? `${Math.round(pct)}%` : '—';
    if (window?.text) pctDisplay = window.text;
    const isErrorText = window?.text === 'File missing' || window?.text === 'Read error';
    const pctClass = isErrorText ? 'error' : (pct != null || window?.text ? '' : 'dim');
    const rwMs = window?.runway_ms;
    const resetsAt = window?.resets_at;
    let rwText = fmtRunway(rwMs) ?? '—';
    let rwClass = runwayClass(rwMs);
    let rwIsLink = false;

    // If exhausted (runway_ms is 0), show time until reset instead
    if (rwMs === 0 && resetsAt) {
      const resetMs = new Date(resetsAt).getTime() - Date.now();
      if (resetMs > 0) {
        rwText = 'in ' + (fmtRunway(resetMs) ?? 'soon');
        rwClass = 'crit';
      }
    }

    // Sign-in hint overrides runway display
    if (signInHint) {
      rwText = 'sign in';
      rwClass = 'signin';
      rwIsLink = true;
    }

    let iconHtml, labelHtml;
    if (isSub) {
      // Continuation row: no icon, indent the tag
      iconHtml = '<div class="provider-icon"></div>';
      labelHtml = `<div class="agent-label" style="padding-left:6px"><span class="win-tag">${windowTag}</span></div>`;
    } else if (windowTag) {
      iconHtml = `<div class="provider-icon">${prov.icon}</div>`;
      labelHtml = `<div class="agent-label">
        <span class="agent-name">${prov.name}</span>
        <span class="win-tag">${windowTag}</span>
      </div>`;
    } else {
      iconHtml = `<div class="provider-icon">${prov.icon}</div>`;
      labelHtml = `<div class="agent-label"><span class="agent-name">${prov.name}</span></div>`;
    }

    const rwInner = rwIsLink
      ? `<a class="runway-link" data-action="gemini-login">${rwText}</a>`
      : rwText;

    const resetTitle = resetsAt && !rwIsLink
      ? ` title="Resets at ${new Date(resetsAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}"`
      : '';

    const costEst = window?.cost_est;
    const costHtml = costEst
      ? `<span class="cost-est has-cost" title="Estimated API-equivalent cost">${costEst.label}</span>`
      : '';

    return `<div class="row${isSub ? ' row-sub' : ''}">
      ${iconHtml}
      ${labelHtml}
      <div class="bar-track"><div class="bar-fill ${fillClass}" style="width:${barW}%"></div></div>
      <span class="pct ${pctClass}">${pctDisplay}</span>
      <span class="runway-col ${rwClass}"${resetTitle}>${rwInner}${costHtml ? `<br>${costHtml}` : ''}</span>
    </div>`;
  }

  // ── Onboarding / connect hints ───────────────────────────────────────────────
  let firstPollDone = false;

  /**
   * Returns true when a snapshot has real data (non-null utilization or a
   * non-error, non-"Not logged in" text value).
   */
  function snapHasData(snap) {
    if (!snap) return false;
    const win = snap.short ?? snap.long;
    if (win?.utilization != null) return true;
    const t = win?.text;
    if (t && t !== 'Not logged in' && t !== 'File missing' && t !== 'Read error') return true;
    return false;
  }

  /**
   * After each render, decide whether to show the connect hint.
   * - Before first poll: show skeleton shimmer (handled in render itself)
   * - After first poll, some providers have no data: show connect hint
   * - All providers have data: hide hint
   */
  function updateConnectHint(snapshots) {
    const hint = document.getElementById('connect-hint');
    if (!hint) return;

    if (!firstPollDone) {
      hint.style.display = 'none';
      return;
    }

    const noData = Object.entries(snapshots).filter(([, s]) => !snapHasData(s));
    if (noData.length === 0) {
      hint.style.display = 'none';
      return;
    }

    const lines = noData.map(([agent]) => {
      switch (agent) {
        case 'claude':
          return `<strong>Claude</strong> — <a id="hint-claude">sign in to claude.ai</a> in the Runway window`;
        case 'codex':
          return `<strong>Codex</strong> — <a id="hint-codex">sign in to chatgpt.com</a> in the Runway window`;
        case 'copilot':
          return `<strong>Copilot</strong> — add your GitHub token in <a id="hint-settings">Settings</a>`;
        default:
          return null;
      }
    }).filter(Boolean);

    if (lines.length === 0) {
      hint.style.display = 'none';
      return;
    }

    hint.style.display = 'block';
    hint.innerHTML = lines.join('<br>');

    // Wire up link handlers after injecting HTML
    document.getElementById('hint-claude')?.addEventListener('click', () => {
      const win = window.open('https://claude.ai', '_blank');
      if (win) win.opener = null;
    });
    document.getElementById('hint-codex')?.addEventListener('click', () => window.runway.openChatGptLogin());
    document.getElementById('hint-gemini')?.addEventListener('click', () => window.runway.openGeminiLogin());
    document.getElementById('hint-settings')?.addEventListener('click', () => window.runway.openSettings());
  }

  // ── Footer: live "Updated X ago" ─────────────────────────────────────────────
  let lastPollMs = null;

  function fmtAgo(ms) {
    const diff = Math.floor((Date.now() - ms) / 1000);
    if (diff < 10)  return 'just now';
    if (diff < 60)  return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    return `${Math.floor(diff / 3600)}h ago`;
  }

  function updateFooter() {
    document.getElementById('last-updated').textContent =
      lastPollMs ? `Updated ${fmtAgo(lastPollMs)}` : '—';
  }

  setInterval(updateFooter, 15000);

  // ── Init ──────────────────────────────────────────────────────────────────────
  document.getElementById('btn-pin').addEventListener('click', async () => {
    const { pinned } = await window.runway.togglePin();
    const btn = document.getElementById('btn-pin');
    btn.classList.toggle('active', pinned);
    btn.textContent = pinned ? '📌' : '📍';
  });

  document.getElementById('btn-refresh').addEventListener('click', async () => {
    const btn = document.getElementById('btn-refresh');
    btn.classList.add('spinning');
    await window.runway.refresh();
    btn.classList.remove('spinning');
  });

  // Delegated handler for sign-in links rendered inside gauge rows
  document.getElementById('gauges').addEventListener('click', (e) => {
    const link = e.target.closest('[data-action]');
    if (!link) return;
    if (link.dataset.action === 'gemini-login') {
      window.runway.openGeminiLogin();
    }
  });

  document.getElementById('btn-settings').addEventListener('click', () => {
    window.runway.openSettings();
  });

  window.runway.onSnapshots((data) => {
    firstPollDone = true;
    render(data);
    updateConnectHint(data);
    lastPollMs = Date.now();
    updateFooter();
  });

  // ── Update banner ─────────────────────────────────────────────────────────────
  function applyUpdateInfo(info) {
    const banner = document.getElementById('update-banner');
    const text   = document.getElementById('update-text');
    const link   = document.getElementById('update-link');
    if (!banner) return;
    if (info?.version) {
      text.textContent = `v${info.version} available`;
      link.onclick = () => window.runway.openExternal(info.downloadUrl || info.releaseUrl);
      banner.style.display = 'flex';
    } else {
      banner.style.display = 'none';
    }
  }

  window.runway.getUpdateInfo().then(applyUpdateInfo);
  window.runway.onUpdateInfo(applyUpdateInfo);

  window.runway.getSnapshots().then((data) => {
    // If snapshots already exist (app has polled before), treat as done
    if (Object.keys(data).length > 0) firstPollDone = true;
    render(data);
    updateConnectHint(data);
    // Use the snapshot timestamp if we don't have a local poll time yet
    const times = Object.values(data).map(s => new Date(s.ts_utc).getTime()).filter(Boolean);
    if (times.length && !lastPollMs) {
      lastPollMs = Math.max(...times);
      updateFooter();
    }
  });
</script>
</body>
</html>
